name: "Build and Publish"
run-name: "Build ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: Version
        
jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        # contents: write pushes the tag; id-token: write is for PyPI Trusted Publishing.
        permissions:
            contents: write
            id-token: write
        steps:
        - name: Checkout
          uses: actions/checkout@v4.1.1
          with: 
            submodules: true
            fetch-tags: true

        - name: Set up Python 3.9
          uses: actions/setup-python@v3
          with:
                python-version: 3.9

        - name: Build pip package
          env:
            VERSION: ${{ inputs.version }}
          run: |
                pip3 install -U pip build
                python3 -m build --sdist --wheel --outdir dist/ .

        - name: Create git tag
          env:
            VERSION: ${{ inputs.version }}
          run: |
            set -x
            git config --local user.email "github-actions@comet.com"
            git config --local user.name "github-actions"
            git tag "${VERSION}"
            git push --no-verify origin "${VERSION}"
                
        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@v1.9.0
          with:
            packages-dir: dist
